name: Publish Pages (GitVerse)

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build:
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build one-pager
        run: python3 scripts/build_site.py

      - name: Verify entrypoint
        run: test -f site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: site

  deploy:
    needs: build
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ">=1.23"

      - name: Deploy to GitVerse Pages
        id: deployment
        uses: actions/deploy-pages@v1
        with:
          artifact_name: gitverse-pages

      - name: Print deploy URL
        run: echo "page_url = ${{ steps.deployment.outputs.page_url }}"
